	<body>

		<script>
			;(() => {
				const googleAnalyticsId = 'G-DGKPY8SHVV'
				const yandexMetrikaId = 94327907
				const deferredScripts = [
					{
						src: 'https://api.winwidget.ru/widgets/callback.js',
						attrs: { 'data-key': 'ad4804b8b484' }
					},
					{
						src: 'https://api.winwidget.ru/widgets/stop-offer.js',
						attrs: { 'data-key': 'a897a4809780' }
					},
					{
						src: 'https://api.winwidget.ru/widgets/wheel.js',
						attrs: { 'data-key': '62f3dcc5ae3c' }
					}
				]

				window.dataLayer = window.dataLayer || []
				window.gtag =
					window.gtag ||
					function () {
						window.dataLayer.push(arguments)
					}
				window.ym =
					window.ym ||
					function () {
						;(window.ym.a = window.ym.a || []).push(arguments)
					}
				window.ym.l = window.ym.l || Number(new Date())

				const loadScript = (src, attrs = {}) => {
					if (document.querySelector(`script[src="${src}"]`)) {
						return
					}

					const script = document.createElement('script')
					script.src = src
					script.async = true

					Object.entries(attrs).forEach(([name, value]) => {
						script.setAttribute(name, value)
					})

					document.body.appendChild(script)
				}

				const loadThirdPartyScripts = () => {
					loadScript(
						`https://www.googletagmanager.com/gtag/js?id=${googleAnalyticsId}`
					)
					window.gtag('js', new Date())
					window.gtag('config', googleAnalyticsId, {
						cookie_flags: 'max-age=7200;secure;samesite=Lax'
					})

					loadScript('https://mc.yandex.ru/metrika/tag.js')
					window.ym(yandexMetrikaId, 'init', {
						clickmap: true,
						trackLinks: true,
						accurateTrackBounce: true,
						webvisor: true,
						ecommerce: 'dataLayer'
					})

					deferredScripts.forEach(({ src, attrs }) => loadScript(src, attrs))
				}

				let isLoaded = false
				let idleId = null
				let timerId = null
				const intentEvents = ['pointerdown', 'keydown', 'touchstart', 'scroll']

				const cleanup = () => {
					if (timerId !== null) {
						window.clearTimeout(timerId)
					}
					if (idleId !== null && 'cancelIdleCallback' in window) {
						window.cancelIdleCallback(idleId)
					}
					intentEvents.forEach(eventName => {
						window.removeEventListener(eventName, loadOnce)
					})
				}

				const loadOnce = () => {
					if (isLoaded) {
						return
					}

					isLoaded = true
					cleanup()
					loadThirdPartyScripts()
				}

				const scheduleIdleLoad = () => {
					if ('requestIdleCallback' in window) {
						idleId = window.requestIdleCallback(loadOnce, { timeout: 2500 })
						return
					}

					timerId = window.setTimeout(loadOnce, 1200)
				}

				intentEvents.forEach(eventName => {
					window.addEventListener(eventName, loadOnce, {
						once: true,
						passive: true
					})
				})

				timerId = window.setTimeout(scheduleIdleLoad, 4500)
			})()
		</script>
